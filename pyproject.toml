[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liparios-comelit"
version = "0.1.0"
description = "Comelit ViP protocol and video runtime for LipariOS"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "av"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["liparios*"]


[project.optional-dependencies]
examples = [
    "opencv-python"
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy"
]

